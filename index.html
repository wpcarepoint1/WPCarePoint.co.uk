    <script>
      (function () {
        try {
          var saved = localStorage.getItem('wpcarepoint-theme');
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
          }

          var savedLang = localStorage.getItem('wpcarepoint-lang');
          var detectedLang = 'en-GB';
          if (savedLang === 'cy') {
            detectedLang = 'cy';
          } else if (savedLang === 'en') {
            detectedLang = 'en-GB';
          } else if (typeof navigator !== 'undefined') {
            var langs =
              Array.isArray(navigator.languages) && navigator.languages.length
                ? navigator.languages
                : [navigator.language];
            for (var i = 0; i < langs.length; i++) {
              var code = (langs[i] || '').toLowerCase().trim();
              if (code === 'cy' || code.indexOf('cy-') === 0) {
                detectedLang = 'cy';
                break;
              }
              if (code === 'en' || code.indexOf('en-') === 0) {
                detectedLang = 'en-GB';
                break;
              }
            }
          }
          document.documentElement.lang = detectedLang;
          var contentLangMeta = document.querySelector(
            'meta[http-equiv="Content-Language"]'
          );
          if (contentLangMeta) {
            contentLangMeta.setAttribute('content', detectedLang);
          }
        } catch (e) {}
      })();
    </script>
